
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipMaster AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090914;color:white;font-family:Arial,sans-serif;padding:20px}
main{max-width:750px;margin:auto}
header{padding:20px 0;border-bottom:1px solid #292943}
h1{font-size:30px}
span{color:#a78bfa}
.panel{background:#17172a;border:1px solid #343450;border-radius:16px;padding:22px;margin-top:25px}
p{color:#b9b8cc;line-height:1.6}
input,select{width:100%;padding:14px;margin:9px 0 18px;background:#0d0d1b;border:1px solid #454568;border-radius:9px;color:white}
button{background:#8b5cf6;color:white;border:0;padding:15px;border-radius:9px;font-weight:bold;width:100%;margin:8px 0}
button:active{opacity:.8}
video{width:100%;border-radius:12px;margin-top:15px}
#preview{display:none}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>
<main>
<header>
<h1>✂️ ClipMaster <span>AI</span></h1>
<p>Seu estúdio inteligente de vídeos curtos.</p>
</header>

<section class="panel">
<h2>🎬 Adicionar vídeo</h2>
<p>Escolha como deseja enviar seu vídeo.</p>

<label>Link do YouTube</label>
<input id="yt" placeholder="Cole o link do YouTube">

<label>Ou envie um vídeo do celular</label>
<input id="file" type="file" accept="video/*">

<video id="preview" controls playsinline></video>

<label>Duração desejada</label>
<select id="duration">
<option>15 a 30 segundos</option>
<option>30 a 60 segundos</option>
<option>60 a 90 segundos</option>
</select>

<label>Formato</label>
<select id="format">
<option>Vertical 9:16 - Shorts e Reels</option>
<option>Quadrado 1:1</option>
<option>Horizontal 16:9</option>
</select>

<label>Legendas</label>
<select id="captions">
<option>Dinâmicas</option>
<option>Simples</option>
<option>Sem legendas</option>
</select>

<button onclick="prepare()">✦ Preparar meu projeto</button>
<p id="status" class="small"></p>
</section>

<section class="panel">
<h2>✂️ Seus próximos cortes</h2>
<p>Seus vídeos preparados aparecerão nesta área.</p>
</section>

<p class="small">ClipMaster AI © 2026 · Grátis para começar.</p>
</main>

<script>
const file=document.getElementById('file');
const preview=document.getElementById('preview');
let videoURL;

file.addEventListener('change',()=>{
 const f=file.files[0];
 if(!f)return;
 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=URL.createObjectURL(f);
 preview.src=videoURL;
 preview.style.display='block';
 document.getElementById('status').textContent='Vídeo carregado com sucesso!';
});

function prepare(){
 const link=document.getElementById('yt').value.trim();
 const f=file.files[0];

 if(!link&&!f){
  alert('Adicione um vídeo ou link primeiro!');
  return;
 }
 if(link&&!f){
  try{
   const u=new URL(link);
   if(!['youtube.com','www.youtube.com','youtu.be','www.youtu.be','m.youtube.com'].includes(u.hostname)){
    alert('Confira o link do YouTube.');
    return;
   }
  }catch{
   alert('Digite um link válido.');
   return;
  }
 }
 document.getElementById('status').textContent=
 'Projeto configurado! A integração com a IA de cortes automáticos ainda precisa ser conectada.';
}
</script>
</body>
  </html>
